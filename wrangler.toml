name = "cunoku"
main = "worker/src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Frontend: npm run build:cf → dist/public
[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "MATCH_QUEUE"
class_name = "MatchQueueDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchQueueDurableObject"]

# Hyperdrive (cunoku-db): reaproveita as conexões com o Neon e corta a latência de cada consulta.
# Usa a conexão direta do Neon (sem -pooler) e o cache de consultas desligado, para o ranking
# e as salas nunca lerem dados atrasados. O DATABASE_URL continua como reserva no código.
# Para `wrangler dev` com banco local, defina CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b08cee4694324e2fbfc4ab2dc56e65ef"

[alias]
"@shared" = "./shared"
