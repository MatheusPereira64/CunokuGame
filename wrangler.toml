name = "cunoku"
main = "worker/src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Frontend: npm run build:cf → dist/public
[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "MATCH_QUEUE"
class_name = "MatchQueueDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchQueueDurableObject"]

# Opcional: descomente após criar o Hyperdrive (wrangler hyperdrive create ...)
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_HYPERDRIVE_ID"
# localConnectionString = "<DATABASE_URL do Postgres local>"

# Sem Hyperdrive: use `wrangler secret put DATABASE_URL` (Neon recomendado)

[alias]
"@shared" = "./shared"
