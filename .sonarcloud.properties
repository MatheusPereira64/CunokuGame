# Configuração da análise automática do SonarCloud

# Dicionários de tradução (pt, es, en) têm as mesmas chaves em cada idioma por natureza:
# o SonarCloud ignora o texto das strings e conta cada linha "chave": "texto" como duplicada.
sonar.cpd.exclusions=client/src/contexts/i18n-context.tsx,client/src/contexts/i18n-features.ts
