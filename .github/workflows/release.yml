name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write Android signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente. Configure em Settings → Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/cunoku-release.keystore
          {
            echo "storeFile=cunoku-release.keystore"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-cunoku}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/keystore.properties

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/Cunoku-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS app
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: bash script/ci-ios-build.sh

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: release-artifacts/xcodebuild.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-build
          path: release-artifacts/*.ipa
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          ls -lh dist-release
          test -f "dist-release/Cunoku-${VERSION}.apk"
          NOTES="releases/RELEASE_NOTES_${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then NOTES="releases/RELEASE_NOTES_1.0.5.md"; fi
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist-release/* --clobber
            gh release edit "${{ github.ref_name }}" --notes-file "$NOTES" --title "Cunoku ${VERSION}"
          else
            gh release create "${{ github.ref_name }}" dist-release/* \
              --title "Cunoku ${VERSION}" \
              --notes-file "$NOTES" \
              --target "${{ github.sha }}"
          fi
