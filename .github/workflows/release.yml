name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - # actions/setup-java@v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        # android-actions/setup-android@v3
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native tooling
        run: |
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi

      - name: Write Android signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente. Configure em Settings → Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/cunoku-release.keystore
          {
            echo "storeFile=cunoku-release.keystore"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-cunoku}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/keystore.properties

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/Cunoku-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-apk
          path: release-artifacts/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native tooling
        run: |
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build iOS app
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: bash script/ci-ios-build.sh

      - name: Upload build log (always)
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-xcodebuild-log
          path: release-artifacts/xcodebuild.log
          if-no-files-found: ignore

      - if: success()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-build
          path: release-artifacts/*.ipa
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts

      - name: Flatten artifacts and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          ls -lh dist-release
          test -f "dist-release/Cunoku-${VERSION}.apk"
          NOTES="releases/RELEASE_NOTES_${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then NOTES="releases/RELEASE_NOTES_1.0.5.md"; fi
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist-release/* --clobber
            gh release edit "${{ github.ref_name }}" --notes-file "$NOTES" --title "Cunoku ${VERSION}"
          else
            gh release create "${{ github.ref_name }}" dist-release/* \
              --title "Cunoku ${VERSION}" \
              --notes-file "$NOTES" \
              --target "${{ github.sha }}"
          fi
