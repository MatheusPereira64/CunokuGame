name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Marca o ambiente GitHub "production" como success quando o job passa
    environment:
      name: production
      url: https://cunoku.cunokugame.workers.dev
    # Aceita CLOUDFLARE_API_TOKEN (correto) ou CLOUDFLARE_API_TOKE (typo legado)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKE: ${{ secrets.CLOUDFLARE_API_TOKE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native tooling
        run: |
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi

      - name: Build frontend
        run: npm run build:cf

      - name: Resolve Cloudflare credentials
        id: cf
        run: |
          TOKEN="${CLOUDFLARE_API_TOKEN:-$CLOUDFLARE_API_TOKE}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN ausente. Configure em Settings → Secrets (não use o nome truncado CLOUDFLARE_API_TOKE)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_API_TOKE" ]; then
            echo "::warning::Usando secret legado CLOUDFLARE_API_TOKE. Renomeie para CLOUDFLARE_API_TOKEN."
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # DATABASE_URL já fica no Worker via: npx wrangler secret put DATABASE_URL
      - name: Deploy to Cloudflare
        # cloudflare/wrangler-action@v3
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
