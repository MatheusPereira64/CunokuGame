name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native tooling
        run: |
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  e2e:
    name: E2E · partida contra bots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native tooling
        run: |
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Play a full match
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
