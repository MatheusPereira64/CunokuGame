name: Attach iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - ".github/workflows/attach-ios.yml"
      - "package.json"
      - "package-lock.json"
      - "client/**"
      - "script/**"
      - "vite.config.ts"

permissions:
  contents: write

concurrency:
  group: attach-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator
        working-directory: ios/App
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived-sim \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
          APP_PATH=$(find derived-sim/Build/Products -name "App.app" -print -quit)
          test -n "$APP_PATH"
          STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE/App.app"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/release-artifacts/Cunoku-1.0.3-ios-simulator.zip" App.app)

      - name: Upload to GitHub Release v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.3 \
            "$GITHUB_WORKSPACE/release-artifacts/Cunoku-1.0.3-ios-simulator.zip" \
            --clobber
