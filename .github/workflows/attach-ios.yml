name: Attach iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - ".github/workflows/attach-ios.yml"
      - "package.json"
      - "package-lock.json"
      - "client/**"
      - "script/**"
      - ".github/workflows/attach-ios.yml"

permissions:
  contents: write

concurrency:
  group: attach-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator
        run: bash script/ci-ios-build.sh

      - name: Upload to GitHub Release v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.3 \
            "$GITHUB_WORKSPACE/release-artifacts/Cunoku-1.0.3-ios-simulator.zip" \
            --clobber
