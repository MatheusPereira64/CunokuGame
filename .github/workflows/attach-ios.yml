name: Attach iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - ".github/workflows/attach-ios.yml"
      - "package.json"
      - "package-lock.json"
      - "client/**"
      - "script/**"

permissions:
  contents: write

concurrency:
  group: attach-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS IPA
        run: bash script/ci-ios-build.sh

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: release-artifacts/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: release-artifacts/*.ipa
          if-no-files-found: error

      - name: Attach IPA to latest matching release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPA="$GITHUB_WORKSPACE/release-artifacts/Cunoku-${VERSION}.ipa"
          test -f "$IPA"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$IPA" --clobber
            if [[ -f "releases/RELEASE_NOTES_${VERSION}.md" ]]; then
              gh release edit "v${VERSION}" --notes-file "releases/RELEASE_NOTES_${VERSION}.md"
            fi
          else
            echo "Release v${VERSION} ainda não existe; IPA ficou só como artifact."
          fi
