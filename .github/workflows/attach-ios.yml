name: Attach iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - ".github/workflows/attach-ios.yml"
      - "package.json"
      - "package-lock.json"
      - "client/**"
      - "script/**"

permissions:
  contents: write

concurrency:
  group: attach-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native tooling
        run: |
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi

      - name: Web build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build iOS IPA
        run: bash script/ci-ios-build.sh

      - name: Upload build log (always)
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-xcodebuild-log
          path: release-artifacts/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: success()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ipa
          path: release-artifacts/*.ipa
          if-no-files-found: error

      - name: Attach IPA to latest matching release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPA="$GITHUB_WORKSPACE/release-artifacts/Cunoku-${VERSION}.ipa"
          test -f "$IPA"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$IPA" --clobber
            if [[ -f "releases/RELEASE_NOTES_${VERSION}.md" ]]; then
              gh release edit "v${VERSION}" --notes-file "releases/RELEASE_NOTES_${VERSION}.md"
            fi
          else
            echo "Release v${VERSION} ainda não existe; IPA ficou só como artifact."
          fi
